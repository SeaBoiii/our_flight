name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INVITE_CODE_HASH_ECONOMY: ${{ secrets.INVITE_CODE_HASH_ECONOMY }}
      INVITE_CODE_HASH_PREMIUM: ${{ secrets.INVITE_CODE_HASH_PREMIUM }}
      INVITE_CODE_HASH_BUSINESS: ${{ secrets.INVITE_CODE_HASH_BUSINESS }}
      INVITE_CODE_HASH_FIRST: ${{ secrets.INVITE_CODE_HASH_FIRST }}
      INVITE_CODE_HASH_BRIDE_ECONOMY: ${{ secrets.INVITE_CODE_HASH_BRIDE_ECONOMY }}
      INVITE_CODE_HASH_BRIDE_PREMIUM: ${{ secrets.INVITE_CODE_HASH_BRIDE_PREMIUM }}
      INVITE_CODE_HASH_BRIDE_BUSINESS: ${{ secrets.INVITE_CODE_HASH_BRIDE_BUSINESS }}
      INVITE_CODE_HASH_BRIDE_FIRST: ${{ secrets.INVITE_CODE_HASH_BRIDE_FIRST }}
      LEGACY_INVITES_ENABLED: ${{ vars.LEGACY_INVITES_ENABLED || 'false' }}
      WEDDING_PASSCODE_HASH: ${{ secrets.WEDDING_PASSCODE_HASH }}
      INVITE_TOKEN_HASH_ECONOMY: ${{ secrets.INVITE_TOKEN_HASH_ECONOMY }}
      INVITE_TOKEN_HASH_PREMIUM: ${{ secrets.INVITE_TOKEN_HASH_PREMIUM }}
      INVITE_TOKEN_HASH_BUSINESS: ${{ secrets.INVITE_TOKEN_HASH_BUSINESS }}
      INVITE_TOKEN_HASH_FIRST: ${{ secrets.INVITE_TOKEN_HASH_FIRST }}
      RSVP_STATUS: ${{ vars.RSVP_STATUS || 'preview' }}
      APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:artifact
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
