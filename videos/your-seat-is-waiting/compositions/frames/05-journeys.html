<!doctype html>
<html
  data-composition-variables='[
    {"id":"lineA","type":"string","label":"First card","default":"Some journeys"},
    {"id":"lineB","type":"string","label":"Second card","default":"change everything."}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/trailer.css" />
      <style>
        #f05-root { position: absolute; inset: 0; overflow: hidden; background: var(--midnight); }
        #f05-all { position: absolute; inset: 0; }
        #f05-glow { position: absolute; left: 240px; top: 980px; width: 1100px; height: 900px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(217, 180, 114, 0.16), rgba(217, 180, 114, 0)); }
        #f05-a { position: absolute; left: 80px; right: 80px; top: 560px; font-size: 168px; line-height: 0.88; letter-spacing: -0.035em; color: var(--ivory); }
        #f05-b { position: absolute; left: 80px; right: 80px; top: 960px; text-align: right; font-size: 168px; line-height: 0.88;
          letter-spacing: -0.03em; font-style: italic; color: var(--gold); }
        #f05-rule { position: absolute; left: 80px; top: 900px; width: 920px; height: 2px; background: rgba(217, 180, 114, 0.45); transform-origin: 0 50%; }
        #f05-flash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 240, 210, 0), rgba(255, 240, 210, 0.9), rgba(255, 240, 210, 0)); opacity: 0; }
      </style>
      <div data-hf-id="hf-h5kq" id="f05-root" data-composition-id="f05-journeys" data-width="1080" data-height="1920">
        <div data-hf-id="hf-7hma" id="f05-all">
          <div data-hf-id="hf-fbw2" id="f05-glow"></div>
          <div data-hf-id="hf-daof" id="f05-a" class="ysw-serif" data-var-text="lineA">Some journeys</div>
          <div data-hf-id="hf-572v" id="f05-rule"></div>
          <div data-hf-id="hf-yvad" id="f05-b" class="ysw-serif" data-var-text="lineB">change everything.</div>
        </div>
        <div data-hf-id="hf-tdnd" id="f05-flash"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Two cards on two bars (local 0 and 2.18), then a whip into the take-off.
        tl.fromTo("#f05-a", { scale: 1.16, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0)
          .fromTo("#f05-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 0.6)
          .fromTo("#f05-b", { x: 120, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 2.18)
          .fromTo("#f05-glow", { opacity: 0.3, scale: 0.8 }, { opacity: 1, scale: 1.2, duration: 4.3, ease: "power1.in" }, 0)
          .fromTo("#f05-all", { xPercent: 0, filter: "blur(0px)" }, { xPercent: -60, filter: "blur(30px)", duration: 0.35, ease: "power3.in" }, 3.95)
          .fromTo("#f05-flash", { opacity: 0, xPercent: 60 }, { opacity: 1, xPercent: -40, duration: 0.35, ease: "power2.in" }, 3.95);
        window.__timelines["f05-journeys"] = tl;
      </script>
    </template>
  </body>
</html>
